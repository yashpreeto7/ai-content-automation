[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-content-automation"
version = "0.1.0"
description = "Autonomous AI-powered video generation, media processing, and viral content engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "AetherFlow Team" }
]
dependencies = [
    "google-genai>=2.10.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "edge-tts>=6.1.9",
    "imageio-ffmpeg>=0.4.9",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pillow>=10.0.0"
]

[project.scripts]
content-engine = "cli:app"
